<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気アプリ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      padding: 32px 28px 36px;
      width: 100%;
      max-width: 440px;
      color: #fff;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    /* 検索バー */
    .search-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input::placeholder { color: rgba(255,255,255,0.35); }
    .search-input:focus { border-color: rgba(255,255,255,0.45); }

    .search-btn {
      padding: 11px 18px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-btn:hover { background: rgba(255,255,255,0.28); }

    /* プリセット都市 */
    .preset-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 24px;
    }

    .preset-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .preset-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .preset-btn.active {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border-color: rgba(255,255,255,0.4);
    }

    /* 天気表示 */
    .weather-main {
      text-align: center;
      padding: 8px 0 24px;
    }

    .weather-emoji {
      font-size: 88px;
      line-height: 1;
      margin-bottom: 14px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    .temperature {
      font-size: 80px;
      font-weight: 200;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .temperature span {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 0;
      vertical-align: super;
      margin-left: 2px;
    }

    .weather-label {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .city-name {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      margin-top: 10px;
      letter-spacing: 0.06em;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 8px 0 22px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .detail-item {
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .detail-icon { font-size: 22px; margin-bottom: 4px; }
    .detail-value { font-size: 18px; font-weight: 600; }
    .detail-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; letter-spacing: 0.05em; }

    .updated-at {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-top: 18px;
      letter-spacing: 0.04em;
    }

    .loading {
      text-align: center;
      padding: 48px 0;
      font-size: 16px;
      color: rgba(255,255,255,0.5);
    }

    .error {
      text-align: center;
      padding: 24px 0;
      font-size: 14px;
      color: #ff8a8a;
      line-height: 1.7;
    }

    .retry-btn {
      margin-top: 14px;
      padding: 10px 24px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .error-detail {
      font-size: 11px;
      color: rgba(255,120,120,0.7);
      margin-top: 6px;
    }

    .fade { opacity: 0; }
    .fade-in { opacity: 1; transition: opacity 0.4s; }
  </style>
</head>
<body>
  <div class="card">
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text"
             placeholder="都市名を入力（例：京都、Kyoto）">
      <button class="search-btn" id="searchBtn">🔍</button>
    </div>
    <div class="preset-grid" id="presetGrid"></div>
    <div id="content">
      <div class="loading">読み込み中...</div>
    </div>
  </div>

  <script>
    const PRESETS = [
      { label: '高松',  query: 'Takamatsu' },
      { label: '東京',  query: 'Tokyo' },
      { label: '大阪',  query: 'Osaka' },
      { label: '京都',  query: 'Kyoto' },
      { label: '名古屋', query: 'Nagoya' },
      { label: '神戸',  query: 'Kobe' },
      { label: '福岡',  query: 'Fukuoka' },
      { label: '札幌',  query: 'Sapporo' },
      { label: '仙台',  query: 'Sendai' },
      { label: '広島',  query: 'Hiroshima' },
      { label: '那覇',  query: 'Naha' },
      { label: '金沢',  query: 'Kanazawa' },
    ];

    function getWeatherInfo(code) {
      const c = Number(code);
      if (c === 113)                        return { emoji: '☀️',  label: '快晴' };
      if (c === 116)                        return { emoji: '🌤️', label: '晴れ時々くもり' };
      if (c === 119 || c === 122)           return { emoji: '☁️',  label: 'くもり' };
      if ([143,248,260].includes(c))        return { emoji: '🌫️', label: '霧' };
      if ([176,263,266,281,293,296].includes(c)) return { emoji: '🌦️', label: '小雨' };
      if ([299,302,305,308,311,314,317].includes(c)) return { emoji: '🌧️', label: '雨' };
      if ([179,182,185,227,230,323,326,329,332,335,338,350,368,371,374,377].includes(c)) return { emoji: '❄️', label: '雪' };
      if ([353,356,359,362,365].includes(c)) return { emoji: '🌦️', label: 'にわか雨' };
      if ([386,389,392,395].includes(c))    return { emoji: '⛈️',  label: '雷雨' };
      return { emoji: '🌡️', label: '不明' };
    }

    // プリセットボタン生成
    const grid = document.getElementById('presetGrid');
    PRESETS.forEach(({ label, query }) => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn';
      btn.textContent = label;
      btn.dataset.query = query;
      btn.dataset.label = label;
      btn.addEventListener('click', () => loadByQuery(query, label, btn));
      grid.appendChild(btn);
    });

    function setActiveBtn(activeBtn) {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');
    }

    const cache = {};

    async function fetchWeather(query) {
      const key = query.toLowerCase();
      if (cache[key] && Date.now() - cache[key].ts < 10 * 60 * 1000) return cache[key].data;
      const url = `https://wttr.in/${encodeURIComponent(query)}?format=j1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      cache[key] = { data: json, ts: Date.now() };
      return json;
    }

    function render(data, displayName) {
      const cur = data.current_condition[0];
      const temp = cur.temp_C;
      const { emoji, label } = getWeatherInfo(cur.weatherCode);
      const humidity = cur.humidity;
      const wind = Math.round(Number(cur.windspeedKmph) / 3.6 * 10) / 10;
      const timeStr = new Date().toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      document.getElementById('content').innerHTML = `
        <div class="weather-main fade" id="weatherMain">
          <div class="weather-emoji">${emoji}</div>
          <div class="temperature">${temp}<span>°C</span></div>
          <div class="weather-label">${label}</div>
          <div class="city-name">${displayName}</div>
        </div>
        <hr class="divider">
        <div class="details">
          <div class="detail-item">
            <div class="detail-icon">💧</div>
            <div class="detail-value">${humidity}%</div>
            <div class="detail-label">湿度</div>
          </div>
          <div class="detail-item">
            <div class="detail-icon">💨</div>
            <div class="detail-value">${wind} m/s</div>
            <div class="detail-label">風速</div>
          </div>
        </div>
        <div class="updated-at">最終更新 ${timeStr}</div>
      `;
      requestAnimationFrame(() => {
        const el = document.getElementById('weatherMain');
        if (el) el.classList.add('fade-in');
      });
    }

    async function loadByQuery(query, displayName, activeBtn = null) {
      document.getElementById('content').innerHTML = '<div class="loading">読み込み中...</div>';
      setActiveBtn(activeBtn);
      try {
        const data = await fetchWeather(query);
        render(data, displayName);
      } catch (e) {
        document.getElementById('content').innerHTML = `
          <div class="error">
            データを取得できませんでした。
            <div class="error-detail">${e.message}</div>
            <button class="retry-btn" onclick="loadByQuery('${query}','${displayName}')">再試行</button>
          </div>`;
      }
    }

    // 検索ボタン
    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    function doSearch() {
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;
      loadByQuery(val, val, null);
    }

    // 初期表示：高松
    const firstBtn = document.querySelector('.preset-btn');
    loadByQuery('Takamatsu', '高松', firstBtn);
  </script>
</body>
</html>
